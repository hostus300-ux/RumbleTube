name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel   # arm64 Mac runners were out of capacity
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode (iOS 26 SDK for Liquid Glass)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Core logic tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RumbleTube.xcodeproj -scheme RumbleTube -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/RumbleTube.app/RumbleTube

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RumbleTube.app Payload/
          zip -qry RumbleTube.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RumbleTube-ipa
          path: RumbleTube.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish "latest" release (easy download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RumbleTube (latest build)
          prerelease: true
          make_latest: false
          body: "Unsigned build of ${{ github.sha }}. Sideload with AltStore / SideStore / your signing tool."
          files: RumbleTube.ipa

  smoke:
    # Launch the app in an iPhone simulator, screenshot every tab and fail if it crashes.
    # Runs beside the IPA build, so a flaky simulator never blocks a release.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project RumbleTube.xcodeproj -scheme RumbleTube -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d simbuild/Build/Products/Debug-iphonesimulator/RumbleTube.app

      - name: Launch each screen and screenshot
        run: bash scripts/smoke.sh simbuild/Build/Products/Debug-iphonesimulator/RumbleTube.app screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
