name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core logic tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RumbleTube.xcodeproj -scheme RumbleTube -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/RumbleTube.app/RumbleTube

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RumbleTube.app Payload/
          zip -qry RumbleTube.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RumbleTube-ipa
          path: RumbleTube.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish "latest" release (easy download from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RumbleTube (latest build)
          prerelease: true
          make_latest: false
          body: "Unsigned build of ${{ github.sha }}. Sideload with AltStore / SideStore / your signing tool."
          files: RumbleTube.ipa
