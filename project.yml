name: RumbleTube
options:
  bundleIdPrefix: com.hostus300
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.2"
    CURRENT_PROJECT_VERSION: "22"
targets:
  RumbleTube:
    type: application
    platform: iOS
    sources:
      - path: RumbleTube
        excludes:
          - "Resources/extract.js"
          - "*.entitlements"
      - path: RumbleTube/Resources/extract.js
        buildPhase: resources
    info:
      path: RumbleTube/Info.plist
      properties:
        CFBundleDisplayName: Rumble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.hostus300.rumbletube.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.hostus300.rumbletube
            CFBundleURLSchemes: [rumbletube]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hostus300.rumbletube
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGN_ENTITLEMENTS: RumbleTube/RumbleTube.entitlements
    dependencies:
      - package: SwiftSoup
      - target: RumbleWidgets
    scheme: {}
  RumbleWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: RumbleWidgets
        excludes:
          - "*.entitlements"
      - path: RumbleTube/Shared
    info:
      path: RumbleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rumble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hostus300.rumbletube.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: RumbleWidgets/RumbleWidgets.entitlements
